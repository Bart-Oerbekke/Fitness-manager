<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>Fitness Manager</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#1b222c;--head:#343e4d;--muted:#a1a9b7;--orange:#ff8b00;--green:#9ae66e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6f8;font:16px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;color:inherit;background:#313b49;font-weight:650;min-height:44px}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--orange);color:#101010}.ghost{background:transparent;color:var(--orange);border:1px solid var(--orange)}.danger{color:#ff9b9b}.muted,small{color:var(--muted)}h1{font-size:25px;margin:8px 0 18px}h2{font-size:19px;margin:0 0 9px}p{line-height:1.5;margin:7px 0}header{position:sticky;top:0;z-index:3;background:#08090bf5;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:19px}main{max-width:620px;margin:auto;padding:0 16px 110px}.card{background:linear-gradient(160deg,#242d39,#171c24);border-radius:13px;margin:12px 0;overflow:hidden;padding:16px}.card.flush{padding:0}.cardhead{background:var(--head);padding:13px 16px;font-weight:700}.inside{padding:16px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.day{padding:9px 0;background:transparent;min-width:0;font-weight:500}.day.selected{background:var(--orange);color:#111}.day small{display:block;color:inherit}.dot{display:block;height:5px;width:5px;border-radius:50%;background:var(--green);margin:4px auto 0}.no-dot{visibility:hidden}.nav{position:fixed;bottom:0;left:0;right:0;background:#101319;border-top:1px solid #303642;padding:8px 6px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:4}.nav button{background:transparent;flex:1;max-width:155px;color:var(--muted);font-size:12px;padding:7px 2px}.nav button b{display:block;font-size:21px}.nav button.active{color:var(--orange)}.actions{position:sticky;bottom:78px;background:#08090bf2;padding:12px 0;display:flex;gap:10px;z-index:2}.actions button{flex:1}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;min-width:0;background:#10151d;border:1px solid #606a79;color:#fff;border-radius:8px;padding:11px}input[type=number]{font-variant-numeric:tabular-nums}.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #303744}.set.done{background:#16271c}.set button{padding:7px;font-size:21px}.set button.checked{background:var(--green);color:#12200b}.progress{height:6px;border-radius:8px;background:#353d48;overflow:hidden;margin:9px 0}.progress i{display:block;background:var(--orange);height:100%}.exercise{padding:12px 0;border-bottom:1px solid #343c48}.exercise:last-child{border-bottom:0}.tag{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:24px 10px}.timer{font-variant-numeric:tabular-nums;color:var(--orange);font-weight:700}a{color:#ffb75a}dialog{background:#202731;color:white;border:1px solid #495362;border-radius:14px;width:min(92vw,480px)}dialog::backdrop{background:#000a}button[aria-current=true]{color:var(--orange)}@media(max-width:360px){main{padding-inline:10px}.set{gap:5px}.card{padding:12px}}
</style></head>
<body><main id="app"></main><nav id="nav" class="nav" aria-label="Hoofdnavigatie"></nav>
<script>
"use strict";
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), dateKey=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-"), dateObj=k=>new Date(k+"T12:00:00"), pretty=k=>dateObj(k).toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"});
const key="fitness-manager-v1", clone=x=>JSON.parse(JSON.stringify(x));
const example={id:"demo",name:"Strength Lowerbody",program:"Voorbeeldprogramma",date:"",exercises:[["Romanian Deadlift - Barbell",3,6,10,true],["Squat - Barbell",3,6,10,true],["Seated Single Leg Curl - Machine",3,8,12,true],["Walking Lunges - Dumbbell",3,6,8,true],["Copenhagen Plank - Knee Dynamic",3,6,8,false]].map(([name,sets,min,max,weighted])=>({id:uid(),name,sets,min,max,weighted,side:false,section:"Strength Lowerbody"}))};
let state={workouts:[example],history:[],active:null};
try{const saved=localStorage.getItem(key);if(saved)state=JSON.parse(saved)}catch(e){console.warn(e)}
let page="home",selected=dateKey(),opened=null,draft=null,restUntil=0,restInterval=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch(e){alert("Opslaan is mislukt. Controleer de browseropslag.");return false}}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function header(title,back=""){return '<header>'+ (back?'<button aria-label="Terug" onclick="navigate(\''+back+'\')">‹</button>':'<span style="color:var(--orange);font-weight:800">FM</span>')+'<strong>'+esc(title)+'</strong><span></span></header>'}
function render(){const nav=[["home","▦","Vandaag"],["workouts","▤","Trainingen"],["history","↗","Historie"],["stats","▥","Progressie"]];$("nav").innerHTML=nav.map(([p,i,t])=>'<button class="'+(page===p?"active":"")+'" onclick="navigate(\''+p+'\')"><b aria-hidden="true">'+i+'</b>'+t+'</button>').join("");$("app").innerHTML=({home,workouts,preview,builder,active,history,stats,detail}[page]||home)();tick()}
function card(w){return '<button class="card full" style="text-align:left" onclick="openWorkout(\''+esc(w.id)+'\')"><div class="row between"><div><small>'+esc(w.program||"Eigen trainingen")+'</small><h2>'+esc(w.name)+'</h2><span class="muted">'+w.exercises.length+' oefeningen · '+w.exercises.reduce((a,e)=>a+e.sets,0)+' sets</span></div><span>›</span></div></button>'}
function home(){let d=dateObj(selected);d.setDate(d.getDate()-d.getDay());let days="";for(let i=0;i<7;i++){let k=dateKey(d);days+='<button class="day '+(k===selected?"selected":"")+'" onclick="chooseDay(\''+k+'\')"><small>'+d.toLocaleDateString("nl-NL",{weekday:"short"})+'</small>'+d.getDate()+'<span class="dot '+(state.history.some(h=>h.date===k)||state.workouts.some(w=>w.date===k)?"":"no-dot")+'"></span></button>';d.setDate(d.getDate()+1)}
return header("Fitness Manager")+'<h1>Hallo, klaar om te trainen?</h1><div class="row between"><button onclick="shiftWeek(-7)" aria-label="Vorige week">‹</button><strong>'+esc(pretty(selected))+'</strong><button onclick="shiftWeek(7)" aria-label="Volgende week">›</button></div><div class="grid">'+days+'</div><h2 style="margin-top:24px">Vandaag / '+esc(pretty(selected))+'</h2>'+(state.active?'<div class="card"><h2>Training in uitvoering</h2><button class="primary full" onclick="navigate(\'active\')">Training hervatten</button></div>':'')+state.workouts.filter(w=>w.date===selected).map(card).join("")+(state.workouts.some(w=>w.date===selected)?"":'<p class="muted">Geen training gepland voor deze dag.</p>')+'<h2 style="margin-top:24px">Kies een training</h2>'+state.workouts.filter(w=>!w.date||w.date!==selected).map(card).join("")+'<button class="primary full" onclick="editWorkout()">＋ Nieuwe training</button>'}
function chooseDay(k){selected=k;render()}function shiftWeek(n){const d=dateObj(selected);d.setDate(d.getDate()+n);chooseDay(dateKey(d))}
function workouts(){let groups={};state.workouts.forEach(w=>(groups[w.program||"Eigen trainingen"]??=[]).push(w));return header("Mijn trainingen")+'<h1>Trainingsprogramma’s</h1><button class="primary full" onclick="editWorkout()">＋ Training aanmaken</button>'+Object.entries(groups).map(([name,items])=>'<h2 style="margin-top:24px">'+esc(name)+'</h2>'+items.map(card).join("")).join("")+(!state.workouts.length?'<p class="empty">Maak je eerste training aan.</p>':'')}
function openWorkout(id){opened=id;navigate("preview")}function preview(){let w=state.workouts.find(x=>x.id===opened);if(!w)return workouts();let hs=state.history.filter(h=>h.workoutId===w.id);let last=hs[0];let sections={};w.exercises.forEach(e=>(sections[e.section||"Oefeningen"]??=[]).push(e));return header("Workout","workouts")+'<h1>'+esc(w.name)+'</h1><p class="muted">'+esc(w.program)+' · '+w.exercises.reduce((s,e)=>s+e.sets,0)+' sets</p>'+(last?'<div class="card">Deze training '+hs.length+' keer voltooid.<br><small>Laatst: '+pretty(last.date)+'</small></div>':'')+Object.entries(sections).map(([name,es])=>'<div class="card flush"><div class="cardhead">'+esc(name)+'</div><div class="inside">'+es.map(e=>'<div class="exercise"><strong>'+esc(e.name)+'</strong><p class="muted">'+e.sets+' sets · '+e.min+'–'+e.max+' reps'+(e.side?' per zijde':'')+(e.weighted?' · kg':'')+'</p></div>').join("")+'</div></div>').join("")+'<div class="row"><button class="ghost" onclick="editWorkout(opened)">Bewerken</button><button class="danger" onclick="deleteWorkout()">Verwijderen</button></div><div class="actions"><button class="primary" onclick="startWorkout()">Start training</button></div>'}
function editWorkout(id){draft=id?clone(state.workouts.find(w=>w.id===id)):{id:uid(),name:"",program:"",date:"",exercises:[]};navigate("builder")}
function syncDraft(){draft.name=$("wname").value;draft.program=$("program").value;draft.date=$("wdate").value;draft.exercises.forEach((e,i)=>{e.name=$("name"+i).value;e.section=$("section"+i).value;e.sets=Number($("sets"+i).value);e.min=Number($("min"+i).value);e.max=Number($("max"+i).value);e.weighted=$("weight"+i).checked;e.side=$("side"+i).checked})}
function builder(){return header("Training samenstellen","workouts")+'<form onsubmit="storeWorkout(event)"><label for="wname">Naam training</label><input id="wname" required maxlength="100" value="'+esc(draft.name)+'" placeholder="Bijv. Lowerbody A"><label for="program">Programma / trainingsblok</label><input id="program" maxlength="100" value="'+esc(draft.program)+'" placeholder="Bijv. Off-season"><label for="wdate">Geplande datum (optioneel)</label><input id="wdate" type="date" value="'+esc(draft.date)+'"><h2 style="margin-top:22px">Oefeningen</h2>'+draft.exercises.map((e,i)=>'<div class="card"><div class="row between"><strong>Oefening '+(i+1)+'</strong><div class="row"><button type="button" aria-label="Omhoog" onclick="moveExercise('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button><button type="button" aria-label="Omlaag" onclick="moveExercise('+i+',1)" '+(i===draft.exercises.length-1?'disabled':'')+'>↓</button><button type="button" class="danger" aria-label="Verwijder oefening" onclick="removeExercise('+i+')">×</button></div></div><label for="name'+i+'">Naam oefening</label><input id="name'+i+'" required maxlength="150" value="'+esc(e.name)+'"><label for="section'+i+'">Onderdeel</label><input id="section'+i+'" value="'+esc(e.section)+'" placeholder="Bijv. Core"><div class="row"><div style="flex:1"><label for="sets'+i+'">Sets</label><input id="sets'+i+'" required type="number" min="1" max="30" value="'+e.sets+'"></div><div style="flex:1"><label for="min'+i+'">Min. reps</label><input id="min'+i+'" required type="number" min="1" max="999" value="'+e.min+'"></div><div style="flex:1"><label for="max'+i+'">Max. reps</label><input id="max'+i+'" required type="number" min="1" max="999" value="'+e.max+'"></div></div><label class="row"><input style="width:auto" type="checkbox" id="weight'+i+'" '+(e.weighted?'checked':'')+'> Gewicht registreren (kg)</label><label class="row"><input style="width:auto" type="checkbox" id="side'+i+'" '+(e.side?'checked':'')+'> Reps per zijde</label></div>').join("")+'<button type="button" class="ghost full" onclick="addExercise()">＋ Oefening toevoegen</button><div class="actions"><button class="primary" type="submit">Training opslaan</button></div></form>'}
function addExercise(){syncDraft();draft.exercises.push({id:uid(),name:"",section:draft.exercises.at(-1)?.section||"",sets:3,min:6,max:10,weighted:true,side:false});render();$("name"+(draft.exercises.length-1)).focus()}
function removeExercise(i){syncDraft();draft.exercises.splice(i,1);render()}function moveExercise(i,n){syncDraft();let j=i+n;if(j<0||j>=draft.exercises.length)return;[draft.exercises[i],draft.exercises[j]]=[draft.exercises[j],draft.exercises[i]];render()}
function storeWorkout(ev){ev.preventDefault();syncDraft();draft.name=draft.name.trim();if(!draft.name||!draft.exercises.length||draft.exercises.some(e=>!e.name.trim()||!Number.isInteger(e.sets)||e.sets<1||e.sets>30||e.min<1||e.max<e.min)){alert("Voeg een naam en minimaal één geldige oefening toe. Max. reps moet minstens min. reps zijn.");return}let i=state.workouts.findIndex(w=>w.id===draft.id);if(i<0)state.workouts.push(draft);else state.workouts[i]=draft;save();opened=draft.id;draft=null;navigate("preview")}
function deleteWorkout(){if(!confirm("Deze training verwijderen? Historie blijft behouden."))return;state.workouts=state.workouts.filter(w=>w.id!==opened);save();navigate("workouts")}
function previous(e,i){for(const h of state.history){const match=h.exercises.find(x=>x.id===e.id||x.name.trim().toLowerCase()===e.name.trim().toLowerCase());const s=match?.logs[i];if(s?.done)return s}return null}
function startWorkout(){if(state.active){if(state.active.workoutId!==opened){alert("Rond eerst je actieve training af of annuleer deze.");}navigate("active");return}const w=state.workouts.find(x=>x.id===opened);state.active={id:uid(),workoutId:w.id,name:w.name,program:w.program,date:dateKey(),startedAt:Date.now(),exercises:w.exercises.map(e=>({...clone(e),logs:Array.from({length:e.sets},()=>({reps:"",kg:"",done:false}))}))};save();navigate("active")}
function active(){let a=state.active;if(!a)return home();let logs=a.exercises.flatMap(e=>e.logs),done=logs.filter(s=>s.done).length;return header("Actieve training","home")+'<h1>'+esc(a.name)+'</h1><div class="row between"><strong id="count">'+done+' / '+logs.length+' sets</strong><span class="timer" id="timer"></span><button onclick="startRest(90)">Rust 90s</button></div><div class="progress"><i id="bar" style="width:'+(done/logs.length*100)+'%"></i></div>'+a.exercises.map((e,i)=>'<div class="card flush"><div class="cardhead">Oefening '+(i+1)+' / '+a.exercises.length+' · '+e.sets+' sets</div><div class="inside"><small>'+esc(e.section)+'</small><h2>'+esc(e.name)+'</h2><p class="muted">Doel: '+e.min+'–'+e.max+' reps'+(e.side?' per zijde':'')+'</p><div class="set muted"><span>Set</span><span>Reps</span><span>'+(e.weighted?'kg':'')+'</span><span>✓</span></div>'+e.logs.map((s,j)=>{let p=previous(e,j);return '<div class="set '+(s.done?'done':'')+'" id="set-'+i+'-'+j+'"><small>'+(j+1)+'</small><input aria-label="Herhalingen set '+(j+1)+'" type="number" inputmode="numeric" min="1" max="999" step="1" placeholder="'+esc(p?.reps??(e.min+"–"+e.max))+'" value="'+esc(s.reps)+'" oninput="logInput('+i+','+j+',\'reps\',this.value)" '+(s.done?'disabled':'')+'>'+(e.weighted?'<input aria-label="Gewicht set '+(j+1)+'" type="number" inputmode="decimal" min="0" step="any" placeholder="'+esc(p?.kg??"kg")+'" value="'+esc(s.kg)+'" oninput="logInput('+i+','+j+',\'kg\',this.value)" '+(s.done?'disabled':'')+'>':'<span></span>')+'<button aria-label="'+(s.done?'Set ongedaan maken':'Set voltooien')+'" aria-pressed="'+s.done+'" class="'+(s.done?'checked':'')+'" onclick="toggleSet('+i+','+j+')">✓</button></div>'}).join("")+'<small>Vorige waarden worden als suggestie getoond.</small></div></div>').join("")+'<div class="actions"><button class="ghost" onclick="cancelWorkout()">Annuleren</button><button class="primary" onclick="finishWorkout()">Training afronden</button></div>'}
function logInput(i,j,k,v){state.active.exercises[i].logs[j][k]=v;save()}
function toggleSet(i,j){let e=state.active.exercises[i],s=e.logs[j];if(!s.done){if(!Number.isInteger(Number(s.reps))||Number(s.reps)<1||Number(s.reps)>999||(e.weighted&&(s.kg===""||!Number.isFinite(Number(s.kg))||Number(s.kg)<0))){alert("Vul de uitgevoerde reps en indien van toepassing het gewicht in.");return} s.done=true;startRest(90)}else s.done=false;save();render()}
function startRest(seconds){restUntil=Date.now()+seconds*1000;clearInterval(restInterval);restInterval=setInterval(tick,250);tick()}function tick(){let el=$("timer");if(!el)return;let left=Math.max(0,Math.ceil((restUntil-Date.now())/1000));el.textContent=restUntil?(left?Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"Rust klaar"):""}
function cancelWorkout(){if(confirm("Actieve training annuleren? De niet-afgeronde registratie gaat verloren.")){state.active=null;restUntil=0;clearInterval(restInterval);save();navigate("home")}}
function finishWorkout(){let a=state.active,logs=a.exercises.flatMap(e=>e.logs);if(!logs.some(s=>s.done)){alert("Vink minimaal één set af.");return}if(logs.some(s=>!s.done)&&!confirm("Niet alle sets zijn voltooid. Training toch opslaan?"))return;state.history.unshift({...a,finishedAt:Date.now()});state.active=null;restUntil=0;clearInterval(restInterval);save();navigate("history")}
function history(){return header("Trainingshistorie")+'<h1>Voltooide trainingen</h1>'+(!state.history.length?'<p class="empty">Je afgeronde trainingen verschijnen hier.</p>':state.history.map(h=>'<button class="card full" style="text-align:left" onclick="openHistory(\''+esc(h.id)+'\')"><small>'+pretty(h.date)+'</small><h2>'+esc(h.name)+'</h2><p class="muted">'+h.exercises.flatMap(e=>e.logs).filter(s=>s.done).length+' voltooide sets · '+Math.max(1,Math.round((h.finishedAt-h.startedAt)/60000))+' min</p></button>').join(""))+'<button class="ghost full" onclick="exportData()">Exporteer mijn gegevens (JSON)</button>'}
function openHistory(id){opened=id;navigate("detail")}function detail(){let h=state.history.find(x=>x.id===opened);if(!h)return history();return header("Trainingsoverzicht","history")+'<h1>'+esc(h.name)+'</h1><p class="muted">'+pretty(h.date)+'</p>'+h.exercises.map(e=>'<div class="card"><h2>'+esc(e.name)+'</h2>'+e.logs.map((s,i)=>'<p class="row between"><span>Set '+(i+1)+'</span><span>'+ (s.done?esc(s.reps)+' reps'+(e.weighted?' · '+esc(s.kg)+' kg':''):'Niet voltooid')+'</span></p>').join("")+'</div>').join("")}
function stats(){let groups={};state.history.forEach(h=>h.exercises.forEach(e=>{let k=e.name.trim().toLowerCase(),g=groups[k]??={name:e.name,max:0,reps:0,volume:0,sets:0,weighted:false};e.logs.filter(s=>s.done).forEach(s=>{g.sets++;g.reps=Math.max(g.reps,Number(s.reps));if(e.weighted){g.weighted=true;g.max=Math.max(g.max,Number(s.kg));g.volume+=Number(s.reps)*Number(s.kg)*(e.side?2:1)}})}));return header("Progressie")+'<h1>Jouw prestaties</h1><div class="card"><small>Voltooide trainingen</small><h1>'+state.history.length+'</h1></div>'+Object.values(groups).map(g=>'<div class="card"><h2>'+esc(g.name)+'</h2><p>Hoogste reps: <strong>'+g.reps+'</strong></p>'+(g.weighted?'<p>Zwaarste set: <strong>'+g.max+' kg</strong></p><p>Geregistreerd volume: '+Math.round(g.volume*100)/100+' kg</p>':'')+'<small>'+g.sets+' voltooide sets</small></div>').join("")+(!Object.keys(groups).length?'<p class="empty">Registreer je eerste training om statistieken te zien.</p>':'')}
function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));let a=document.createElement("a");a.href=u;a.download="fitness-manager-"+dateKey()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
render();
</script></body></html>
