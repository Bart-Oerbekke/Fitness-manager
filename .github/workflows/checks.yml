name: Fitness Manager checks
on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
permissions:
  contents: read
jobs:
  checks:
    name: Syntax and domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: IndexedDB browser integration
        run: |
          python3 -m http.server 8000 > /tmp/fm-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/test/storage.browser.html >/dev/null && break; sleep 1; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node scripts/test-browser.mjs
